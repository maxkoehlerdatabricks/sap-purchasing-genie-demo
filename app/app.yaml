# ============================================================================
# Databricks App manifest — SAP Purchasing demo app.
# Runs a FastAPI backend that (1) serves the built React frontend as static files,
# (2) queries the gold layer / metric views via the SQL warehouse for the charts,
# (3) sends the chat tab to the supervisor agent app (Agent Bricks CLI), and
# (4) reads/writes mitigation cases in Lakebase (Postgres) for the cases tab.
# ============================================================================
command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]

env:
  # The SQL warehouse used for the visualization queries. Wired as an app resource
  # below AND surfaced here as an env var the backend reads.
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  # URL of the supervisor agent app (agent-bricks-sap-supervisor) powering the chat
  # tab. Set by app/deploy_app from the _SUPERVISOR table written by 06a.
  - name: SUPERVISOR_URL
    value: ""
  # Fully-qualified schema the charts read from, and the Lakebase coordinates for the
  # Mitigation cases tab. NOTE: app/deploy_app passes ALL of these as deployment
  # env_vars from 00_config (overriding this file), so the values below are only
  # defaults for a manual `databricks apps deploy`.
  - name: DEMO_CATALOG
    value: "max_kohler_demo_catalog"
  - name: DEMO_SCHEMA
    value: "purchasing_demo"
  - name: LAKEBASE_DATABASE
    value: "purchasing_ops"
  - name: LAKEBASE_SCHEMA
    value: "ops"
  - name: LAKEBASE_SYNC_SCHEMA
    value: "purchasing_demo_sync"
